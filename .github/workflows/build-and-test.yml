name: "Build & Test Pipeline"
run-name: "Build & Test · ${{ github.ref_name }} · @${{ github.actor }} (run #${{ github.run_number }})"

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show build context
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          TRIGGERED_BY: ${{ github.actor }}
        run: |
          echo "Building PR: $PR_TITLE"
          echo "Triggered by: $TRIGGERED_BY"

      - name: Build
        run: |
          set -e

          mkdir dist

          echo "commit: $GITHUB_SHA"      >  dist/build-info.txt
          echo "run:    $GITHUB_RUN_ID"   >> dist/build-info.txt
          echo "built:  $(date -u)"       >> dist/build-info.txt

          cat dist/build-info.txt

      - name: Upload build output as artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist

      - name: Test
        run: |
          set -e
          ls -l dist
          test -f dist/build-info.txt
          grep "commit: $GITHUB_SHA" dist/build-info.txt
          echo "All checks passed"
